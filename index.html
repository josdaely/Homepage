<p>Hello! My name is Josie and I'm a 2nd year student in the Applied Media Communications program at UCBA. I have a strong passion for video & photography, so after I graduate I plan on starting a career in those fields.</p>

<p>When I'm not at school or working in the equipment office, I'm usually out and about with friends, especially Downtown. I grew up in Westwood and would spend every weekend hanging out at Sawyer Point (before the fire ate it).</p>

<p>When I spend my freetime at home though, I'll either be watching movies or playing videogames. Currently, I've been playing a lot of Fortnite, revisiting Zombies on COD Cold War, and re-playing the BioShock series. Some of my other favorties are Saints Row, Fallout: New Vegas, and I have a soft spot for Call of Duty: Ghosts.</p>

<p>Touching more on the "education" section of this "info graphic," after finishing my final semesters here at UCBA, I'll spend two semesters finishing a Bachelor's degree in the Digital Media Collaborative. I'll be able to put my love for games to use in their "game design" pathway. Who knows, maybe I'll take over as CEO at Activision and release an actual playable game!</p>
